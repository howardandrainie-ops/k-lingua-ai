name: iOS Build & Test

on:
  push:
    # 只改網頁版時不需要跑 macOS 編譯
    paths-ignore:
      - 'web/**'
      - '.github/workflows/web-deploy.yml'
      - 'Docs/WEB_APP.md'
  pull_request:
    paths-ignore:
      - 'web/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: KLinguaCore 單元測試
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: Structure check
        run: python3 Tools/validate_project.py
      - name: swift test
        working-directory: Packages/KLinguaCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../core-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-log
          path: core-test.log

  ios-build:
    name: iOS App 編譯（模擬器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Resolve packages
        run: xcodebuild -project KLingua.xcodeproj -scheme KLingua -resolvePackageDependencies
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project KLingua.xcodeproj \
            -scheme KLingua \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KLingua.xcodeproj \
            -scheme KLingua \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee -a build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: build.log

  app-tests:
    name: App 整合測試與 UI 測試（模擬器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          def ver(runtime):
              m = re.search(r"iOS-(\d+)-(\d+)", runtime)
              return (int(m.group(1)), int(m.group(2))) if m else (0, 0)
          best = sorted(((ver(k), d) for k, v in devices.items() if "iOS" in k for d in v if d["name"].startswith("iPhone")),
                        key=lambda t: t[0])[-1][1]
          print(best["udid"])
          print(best["name"], file=sys.stderr)
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project KLingua.xcodeproj \
            -scheme KLingua \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            2>&1 | tee app-test.log
      - name: Export screenshots
        if: always()
        run: |
          mkdir -p screenshots
          xcrun xcresulttool export attachments --path TestResults.xcresult --output-path screenshots || true
          ls screenshots | head -50
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-test-results
          path: |
            app-test.log
            screenshots
