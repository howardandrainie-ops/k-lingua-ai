name: iOS Build & Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-tests:
    name: KLinguaCore 單元測試
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
          swift --version
      - name: Structure check
        run: python3 Tools/validate_project.py
      - name: swift test
        working-directory: Packages/KLinguaCore
        run: |
          set -o pipefail
          swift test 2>&1 | tee ../../core-test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: core-test-log
          path: core-test.log

  ios-build:
    name: iOS App 編譯（模擬器）
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"
          xcodebuild -version
      - name: Resolve packages
        run: xcodebuild -project KLingua.xcodeproj -scheme KLingua -resolvePackageDependencies
      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project KLingua.xcodeproj \
            -scheme KLingua \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee build.log
      - name: Build for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project KLingua.xcodeproj \
            -scheme KLingua \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee -a build.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-build-log
          path: build.log
