# XcodeGen 備援規格。
# 主要方式：直接開啟 KLingua.xcodeproj（Xcode 16+）。
# 若 Xcode 無法開啟手寫的 project.pbxproj，在 macOS 執行：
#   brew install xcodegen && xcodegen generate
# 會依本檔重新產生 KLingua.xcodeproj（會覆蓋現有檔案）。
name: KLingua
options:
  bundleIdPrefix: com.personal
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hant
packages:
  KLinguaCore:
    path: Packages/KLinguaCore
targets:
  KLingua:
    type: application
    platform: iOS
    sources:
      - path: KLingua
    dependencies:
      - package: KLinguaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.klingua
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: K-LINGUA
        INFOPLIST_KEY_NSMicrophoneUsageDescription: K-LINGUA 需要使用麥克風錄下你的韓語發音，用於發音訓練與 AI 口語對話。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: K-LINGUA 需要語音辨識功能，將你說的韓語轉為文字以進行口語練習與糾錯。
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
